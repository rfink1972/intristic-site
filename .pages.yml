# Pages CMS settings: tells app.pagescms.org which forms to show.
content:
  - name: home
    label: Homepage
    type: file
    path: content/home.json
    fields:
      - name: headline_main
        label: Headline (white part)
        type: string
      - name: headline_accent
        label: Headline (cyan part)
        type: string
      - name: tagline
        label: Tagline
        description: Wrap a word in *asterisks* to highlight it.
        type: string
      - name: buttons
        label: Buttons
        type: object
        fields:
          - name: primary_label
            label: Main button text (leave blank to hide)
            type: string
          - name: primary_link
            label: Main button link
            type: string
          - name: secondary_label
            label: Second button text (leave blank to hide)
            type: string
          - name: secondary_link
            label: Second button link
            type: string
      - name: stats
        label: Stats bar
        type: object
        list: true
        fields:
          - name: value
            label: Big value
            type: string
          - name: label
            label: Caption
            type: string
      - name: section_label
        label: Section label (small cyan text)
        type: string
      - name: section_title
        label: Section title
        description: Press Enter for a line break.
        type: text
      - name: cards
        label: Cards
        type: object
        list: true
        fields:
          - name: icon
            label: Icon
            type: select
            options:
              values:
                - value: hexagon
                  label: Hexagon
                - value: grid
                  label: Grid
                - value: target
                  label: Target
                - value: diamond
                  label: Diamond
                - value: bolt
                  label: Lightning bolt
          - name: title
            label: Title
            type: string
          - name: text
            label: Description
            type: text
      - name: footer_text
        label: Footer text
        type: string
