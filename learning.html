<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Learning Roadmap | Intristic.net</title>
  <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Rajdhani:wght@300;400;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #040810; --surface: #080f1e; --cyan: #00e5ff; --blue: #0a6fff;
      --dim: #1a2a40; --text: #c8dff5; --muted: #4a6480; --err: #ff5470;
    }
    html, body { min-height: 100%; background: var(--bg); color: var(--text); font-family: 'Rajdhani', sans-serif; }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background-image:
        linear-gradient(rgba(0,229,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,229,255,0.03) 1px, transparent 1px);
      background-size: 60px 60px; animation: gridShift 20s linear infinite;
    }
    body::after {
      content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background: radial-gradient(ellipse 80% 60% at 50% 10%, rgba(10,111,255,0.12) 0%, transparent 70%);
    }
    @keyframes gridShift { to { background-position: 60px 60px, 60px 60px; } }
    .scanline {
      position: fixed; top: 0; left: 0; right: 0; height: 2px; z-index: 200; pointer-events: none;
      background: linear-gradient(90deg, transparent, rgba(0,229,255,0.15), transparent);
      animation: scanDown 6s linear infinite;
    }
    @keyframes scanDown { from { top: -2px; } to { top: 100vh; } }

    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; justify-content: space-between; align-items: center;
      padding: 1.4rem 3rem; border-bottom: 1px solid rgba(0,229,255,0.08);
      backdrop-filter: blur(12px); background: rgba(4,8,16,0.6);
    }
    nav a { text-decoration: none; }
    .nav-wordmark { font-family: 'Syncopate', sans-serif; font-size: 0.75rem; letter-spacing: 0.25em; color: var(--cyan); text-transform: uppercase; }
    .nav-home { font-weight: 600; font-size: 0.85rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); transition: color .2s; }
    .nav-home:hover { color: var(--cyan); }

    main {
      position: relative; z-index: 1; min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 6rem 1.5rem 3rem;
      animation: riseIn 1s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    @keyframes riseIn { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
    .logo { width: 96px; height: 96px; margin-bottom: 2rem;
      filter: drop-shadow(0 0 16px rgba(0,229,255,0.45)); }
    .ring { animation: spin 18s linear infinite; transform-origin: center; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .label { font-family: 'Syncopate', sans-serif; font-size: 0.6rem; letter-spacing: 0.35em; text-transform: uppercase; color: var(--cyan); margin-bottom: 1rem; }
    h1 { font-family: 'Syncopate', sans-serif; font-size: clamp(2rem, 7vw, 3.6rem); font-weight: 700; color: #fff; line-height: 1; }
    h1 span { color: var(--cyan); }

    form { margin-top: 2.5rem; width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 0.9rem; }
    input[type=password] {
      width: 100%; background: var(--surface); border: 1px solid var(--dim); border-radius: 2px;
      padding: 0.9rem 1rem; font-family: 'Rajdhani', sans-serif; font-size: 1.05rem; letter-spacing: 0.08em;
      color: var(--text); outline: none; text-align: center; transition: border-color .2s, box-shadow .2s;
    }
    input[type=password]::placeholder { color: var(--muted); letter-spacing: 0.2em; text-transform: uppercase; font-size: 0.85rem; }
    input[type=password]:focus { border-color: rgba(0,229,255,0.5); box-shadow: 0 0 20px rgba(0,229,255,0.12); }
    form.bad input[type=password] { border-color: var(--err); animation: shake .35s; }
    @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
    button {
      font-family: 'Syncopate', sans-serif; font-size: 0.65rem; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase;
      padding: 0.95rem 2rem; border: none; border-radius: 2px; cursor: pointer;
      background: var(--cyan); color: #040810; box-shadow: 0 0 25px rgba(0,229,255,0.35); transition: all .25s;
    }
    button:hover { background: #fff; box-shadow: 0 0 40px rgba(0,229,255,0.6); }
    button:disabled { opacity: 0.6; cursor: wait; }
    .remember { display: flex; align-items: center; justify-content: center; gap: 0.5rem; font-size: 0.9rem; color: var(--muted); letter-spacing: 0.05em; cursor: pointer; }
    .remember input { accent-color: var(--cyan); }
    .msg { min-height: 1.2rem; font-size: 0.9rem; letter-spacing: 0.08em; color: var(--err); }
    noscript { color: var(--muted); margin-top: 1rem; }

    @media (max-width: 640px) { nav { padding: 1.1rem 1.25rem; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
  </style>
</head>

  const KEY_STORE = "intristic-vault-key:" + V.salt;   // one remembered key per encryption run
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

  async function deriveKey(pw) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: b64(V.salt), iterations: V.iter, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
  }
  async function open(key) {
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(V.iv) }, key, b64(V.data));
    const html = new TextDecoder().decode(plain);
    document.open(); document.write(html); document.close();
  }
  async function tryRemembered() {
    let raw = null;
    try { raw = localStorage.getItem(KEY_STORE); } catch (e) {}
    if (!raw) return;
    try {
      const key = await crypto.subtle.importKey("raw", b64(raw), "AES-GCM", false, ["decrypt"]);
      await open(key);
    } catch (e) { try { localStorage.removeItem(KEY_STORE); } catch (_) {} }
  }

  const f = document.getElementById("f"), pw = document.getElementById("pw"),
        go = document.getElementById("go"), msg = document.getElementById("msg"),
        rem = document.getElementById("rem");
  f.addEventListener("submit", async e => {
    e.preventDefault();
    f.classList.remove("bad"); msg.textContent = ""; go.disabled = true; go.textContent = "Unlocking…";
    try {
      const key = await deriveKey(pw.value);
      if (rem.checked) {
        const raw = new Uint8Array(await crypto.subtle.exportKey("raw", key));
        try { localStorage.setItem(KEY_STORE, btoa(String.fromCharCode(...raw))); } catch (_) {}
      }
      await open(key);
    } catch (err) {
      void f.offsetWidth; f.classList.add("bad");
      msg.textContent = "Incorrect password"; pw.select();
      go.disabled = false; go.textContent = "Unlock";
    }
  });
  // Run after the page has fully loaded so the vault replaces the lock screen cleanly.
  if (document.readyState === "complete") tryRemembered();
  else window.addEventListener("load", tryRemembered);
